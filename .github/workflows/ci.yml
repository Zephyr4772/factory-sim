name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate a sample audit report
        shell: bash
        run: |
          if [ -f build/Release/factory_sim.exe ]; then BIN=build/Release/factory_sim.exe; else BIN=build/factory_sim; fi
          "$BIN" audit examples/bike_assembly.json --pdf audit_sample.pdf

      - name: Upload the sample audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-sample-${{ matrix.os }}
          path: audit_sample.pdf
